<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML - Online Payment</title>
  </head>
  <body>
    <form>
      <label for="address">Address: </label>
      <input
        type="text"
        name="address"
        id="address"
        placeholder="address"
        size="30px"
        maxlength="100"
      />
      <br />
      <br />
      <label for="postcode">Postcode: </label>
      <input
        type="text"
        name="postcode"
        id="postcode"
        placeholder="postcode"
        size="30px"
        maxlength="6"
      />
      <br />
      <br />
      <label for="city">City: </label>
      <input
        type="text"
        name="city"
        id="city"
        placeholder="city"
        size="30px"
        maxlength="100"
      />
      <br />
      <br />
      <p>Choose your shipping method:</p>
      <select name="shipping" id="shipping">
        <option value="Free supper save shipping">
          Free supper save shipping
        </option>
        <option value="Two day shipping">Two day shipping</option>
        <option value="One day shipping">One day shipping</option>
      </select>
      <p>Choose Your Payment Mode:</p>
      <label for="credit"
        >Credit card <input type="radio" name="payment" value="credit card"
      /></label>
      <label for="paypal"
        >Paypal card <input type="radio" name="payment" value="paypal"
      /></label>
      <label for="debit"
        >Debit card <input type="radio" name="payment" value="debit card"
      /></label>
      <br />
      <label for="comments">Comment</label>
      <textarea name="comments" id="comments" rows="4" cols="40"></textarea>
      <br/>
      <label for="secur">Sign me up for emails <input type="checkbox" name="email updates" checked="checked"></label>
      <label>Securly save my payment details <input type="checkbox" name="save payment" checked="checkbox"></label>
      <br/>
      <input type="submit" value="submit">
    </form>
  </body>
</html>
