<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML: ordered List</title>
  </head>
  <body>
    <h1>ordered List</h1>
    <ol>
      <li>Paris</li>
      <li>London</li>
      <ol>
        <li>Cloudy</li>
        <li>rain</li>
      </ol>
      <li>India</li>
    </ol>
    <ol type="A">
      <li>Paris</li>
      <li>London</li>
      <ol>
        <li>Cloudy</li>
        <li>rain</li>
      </ol>
      <li>India</li>
    </ol>
  </body>
</html>
