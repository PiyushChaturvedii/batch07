<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS:Styling Link</title>
    <style>
        a{
            color: springgreen;
        }

      .blue {
        background-color: blue;
        color: white;
        width: auto;
        height: 100px;

      }
      .yellow {
        background-color: yellow;
        color: white;
        width: auto;
        height: 100px;
      }
      .green {
        background-color: green;
        color: white;
        width: auto;
        height: 100px;
      }
      .red {
        background-color: red;
        color: white;
        width: auto;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <h1>Styling Link</h1>
    <div class="blue">
      <p>
        <a href="http://www.aeeron.in">Aeeron Visit Link</a>
      </p>
      <h1></h1>
    </div>
    <div class="yellow">
      <p>
        <a href="http://www.google.in">Google Visit Link</a>
      </p>
    </div>
    <div class="green">
      <p>
        <a href="http://www.amazon.in">Amazon Visit Link</a>
      </p>
    </div>
  </body>
</html>
