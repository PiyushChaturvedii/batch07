<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS: 3dTransform</title>
    <style>
      /*
        Property
        element 
        rotate - ghumana
        scale - scale
        translate- khiskanaq
        skew - tircha
        X n Y (2 dimensions)
        translate(x,y) - move
        rotate(angle) - rotate clockwise
        scale(x,y) - resize
        skew(x-angle, y-angle) - Skew (tilt) the element alng 
        matrix(a, b, c, d, e, f) - combine al above in one function
         */

      /* 
         3D transforms element - X, Y and Z axis -depth
         Property
         rotateX
         rotateY
         rotateZ
         translateZ
         scaleZ
         perspective(n) - Set depth
         */

      .blue {
        background-color: blue;
        color: white;
        height: 100px;
        width: 100px;
        transform: rotate(45deg);
      }
      .yellow {
        background-color: yellow;
        color: white;
        height: 100px;
        width: auto;
      }
      .green {
        width: 100px;
        height: 100px;
        background: teal;
        margin: 20px;
        transform: rotateY(60deg);
        perspective: 800px;
        transform-style: preserve-3d;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Styling Links</h1>
    <div class="blue">
      <p>Facebook</p>
      <p><a href="http://www.facebook.com">Visit Link</a></p>
    </div>
    <div class="yellow">
      <p>amazon</p>
      <p><a href="http://www.amazon.com">Visit Link</a></p>
    </div>
    <div class="green">
      <p>aeeron</p>
      <p><a href="http://www.aeeron.com">Visit Link</a></p>
    </div>
  </body>
</html>
