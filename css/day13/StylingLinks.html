<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Styling Links</title>
    <style>
        a{
            color: red;
        }
        a:link{
            color: rgb(178, 229, 11);
        }
        a:hover{
            font-size: 3em;
            color: violet;
        }
        .blue{
            /* background-color: blue; */
            color: white;
            height: 100px;
            width: auto;
        }
        .yellow{
            /* background-color: yellow; */
            color: white;
            height: 100px;
            width: auto;
        }
        .green{
            /* background-color: green; */
            color: white;
            height: 100px;
            width: auto;
        }
    </style>
</head>
<body>
    <h1>Styling Links</h1>
    <div class="blue">
        <p>Facebook</p>
        <p><a href="http://www.facebook.com">Visit Link</a></p>
    </div>
    <div class="yellow">
        <p>amazon</p>
        <p><a href="http://www.amazon.com">Visit Link</a></p>
    </div>
    <div class="green">
        <p>aeeron</p>
        <p><a href="http://www.aeeron.com">Visit Link</a></p>
    </div>
</body>
</html>
