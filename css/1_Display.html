<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS_Display</title>
    <style>
        .blue{
            background-color: blue;
            color: white;
            height: 100px;
            width: auto;
            /* visibility: hidden; */
            text-decoration: underline;
            font-weight: bold;
            text-align: center
        }
        .yellow{
            background-color: rgb(106, 6, 123);
            color: white;
            height: 100px;
            width: auto;
            /* display: none; */
            text-decoration: overline;
            font-style: italic;
            font-size: 1.5em;
            text-align: right;
        }
        .green{
            background-color: green;
            color: white;
            height: 100px;
            width: auto;
            text-decoration: overline;
            font-style: italic;
            font-size: 2em;
            text-decoration: dotted;
            letter-spacing: 10px;
            text-shadow: 3px 3px red;
        }
        .social{
            background-color: rgb(25, 1, 25);
        }
    </style>
</head>
<body>
    <div class="green">Social <span class="blue">Media</span> plateform</div>
    <div class="yellow">Apple</div>
    <div class="blue">Microsoft</div>

</body>
</html>
