<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Links</title>
    <style>
        .blue{
            background-color: blue;
            color: white;
            height: 100px;
            width: auto;
        }
        .yellow{
            background-color: rgb(195, 195, 11);
            color: white;
            height: 100px;
            width: auto;
        }
        .red{
            background-color: red;
            color: white;
            height: 100px;
            width: auto;
        }
        a:link{
            color: rgb(104, 222, 104);
        }
        a:hover{
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div class="blue">Facebook
    <p><a href="https://www.amazon.in/">Visit Link</a></p>
</div>
    <div class="yellow">Micorsoft
    <p><a href="https://www.ebay.in/">Visit Link</a></p>
</div>
    <div class="red">Apple
    <p><a href="https://www.aeeron.in/">Visit Link</a></p>
</div>
</body>
</html>
